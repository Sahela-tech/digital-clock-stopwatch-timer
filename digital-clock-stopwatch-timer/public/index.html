<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock, Stopwatch & Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 420px;
            text-align: center;
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin: 1.5rem 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn.start { background: #00b894; color: #fff; }
        .btn.stop { background: #d63031; color: #fff; }
        .btn.reset { background: #fdcb6e; color: #2d3436; }

        .hidden { display: none; }
    </style>

    <link rel="stylesheet" href="../modules/clock/clock.css">
    <link rel="stylesheet" href="../modules/stopwatch/stopwatch.css">
    <link rel="stylesheet" href="../modules/timer/timer.css">
</head>
<body>
    <div class="container">
        <nav class="tabs">
            <button class="tab-btn active" data-tab="clock">Clock</button>
            <button class="tab-btn" data-tab="stopwatch">Stopwatch</button>
            <button class="tab-btn" data-tab="timer">Timer</button>
        </nav>

        <!-- Digital Clock Module -->
        <div id="clock" class="tab-content active">
            <div class="display" id="clock-display">00:00:00 AM</div>
            <div class="date-display" id="date-display">Monday, Jan 1, 2026</div>
        </div>

        <!-- Stopwatch Module -->
        <div id="stopwatch" class="tab-content">
            <div class="display" id="stopwatch-display">00:00:00.00</div>
            <div class="controls">
                <button id="sw-start" class="btn start">Start</button>
                <button id="sw-stop" class="btn stop" disabled>Stop</button>
                <button id="sw-reset" class="btn reset" disabled>Reset</button>
            </div>
        </div>

        <!-- Timer Module -->
        <div id="timer" class="tab-content">
            <div class="timer-inputs" id="timer-inputs">
                <input type="number" id="timer-hrs" min="0" max="99" placeholder="HH" value="00">
                <span>:</span>
                <input type="number" id="timer-min" min="0" max="59" placeholder="MM" value="00">
                <span>:</span>
                <input type="number" id="timer-sec" min="0" max="59" placeholder="SS" value="00">
            </div>
            <div class="display hidden" id="timer-display">00:00:00</div>
            <div class="controls">
                <button id="tm-start" class="btn start">Start</button>
                <button id="tm-stop" class="btn stop" disabled>Stop</button>
                <button id="tm-reset" class="btn reset" disabled>Reset</button>
            </div>
        </div>
    </div>

    <script src="../modules/clock/clock.js"></script>
    <script src="../modules/stopwatch/stopwatch.js"></script>
    <script src="../modules/timer/timer.js"></script>
    <script src="../app.js"></script>
</body>
</html>
